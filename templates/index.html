<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Гриб Контроль</title>
  <style>
    :root {
      --bg: #f3efe6;
      --card: #fffdf8;
      --ink: #201e1b;
      --danger: #8e2020;
      --muted: #625d55;
      --border: #d9d0c1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    main { max-width: 760px; margin: 36px auto; padding: 0 16px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,.06);
    }
    .status {
      border-left: 6px solid var(--danger);
      background: #fff2f2;
      padding: 14px;
      border-radius: 8px;
      margin: 18px 0;
    }
    .code { color: var(--muted); font-size: 13px; }
    a {
      display: inline-block;
      color: white;
      background: var(--danger);
      border-radius: 9px;
      padding: 10px 14px;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>Гриб Контроль</h1>
      <p>Автономный инструмент предварительной оценки риска по нескольким фотографиям.</p>
      {% if result %}
      <div class="status" role="alert">
        <div class="code">{{ result.status }}</div>
        <h2>{{ result.title }}</h2>
        <p>{{ result.message }}</p>
        <p><strong>{{ result.safety_banner }}</strong></p>
      </div>
      {% endif %}
      <a href="/emergency">Экстренная помощь</a>
    </section>
  </main>
</body>
</html>
